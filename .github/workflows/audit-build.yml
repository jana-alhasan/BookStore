name: BookStore Audit Build

on:
  push:
    branches:
      - bs-audit-hardening

permissions:
  contents: write

jobs:
  audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package lock if needed
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add reproducible dependency lockfile"
            git push origin HEAD:bs-audit-hardening
          elif [ -f package-lock.json ] && ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add reproducible dependency lockfile"
            git push origin HEAD:bs-audit-hardening
          fi

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Reject legacy Material UI source imports
        run: |
          if grep -R --line-number '@material-ui/' src; then
            echo 'Legacy Material UI v4 source imports remain.'
            exit 1
          fi

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build production bundle
        run: npm run build
