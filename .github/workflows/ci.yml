name: CI

on:
  pull_request:
    branches:
      - newBranch
  push:
    branches:
      - newBranch

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Reject legacy Material UI imports
        run: |
          if grep -R --line-number '@material-ui/' src; then
            echo 'Legacy Material UI v4 source imports found.'
            exit 1
          fi
      - name: Run tests
        run: npm test -- --watchAll=false
      - name: Build production bundle
        run: npm run build
